apply plugin: 'com.android.application'

android {
    namespace 'com.github.dachhack.sprout'
    compileSdk 35

    defaultConfig {
        applicationId "com.github.dachhack.sprout"
        minSdk 21          // was 8; AGP 8 will not go below 21
        targetSdk 35
        // Every first person build gets its own code, or Android decides
        // the install is "already up to date" and silently keeps the old
        // one. Eight builds shipped with 190 before this was spotted.
        versionCode 230
        versionName "0.4.2-fp30"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
