apply plugin: 'com.android.application'

android {
    namespace 'com.github.dachhack.sprout'
    compileSdk 35

    defaultConfig {
        // La identidad de la app es MIA; el paquete del codigo sigue siendo
        // el de dachhack a proposito. Renombrar com.github.dachhack.sprout
        // en 953 archivos romperia las partidas guardadas (el sistema de
        // Bundle guarda nombres de clase) y ademas destrozaria el diff
        // contra el upstream. Gradle separa las dos cosas justo para esto.
        //
        // Es PERMANENTE en cuanto se publique en Play: no se puede cambiar.
        applicationId "com.jaliscomundial.pixeldoomgeon"
        minSdk 21          // was 8; AGP 8 will not go below 21
        targetSdk 35
        // Every first person build gets its own code, or Android decides
        // the install is "already up to date" and silently keeps the old
        // one. Eight builds shipped with 190 before this was spotted.
        versionCode 236
        versionName "0.4.6-fp33"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // La firma sale de firma.properties, que NO esta en el repo. Sin ese
    // archivo el release se compila igual pero sale sin firmar -- asi
    // cualquiera puede clonar y compilar sin tener la llave, que es lo que
    // pide la GPL, y la llave no se publica, que es lo que pide el sentido
    // comun.
    signingConfigs {
        release {
            def f = rootProject.file('firma.properties')
            if (f.exists()) {
                def p = new Properties()
                f.withInputStream { p.load(it) }
                storeFile     file(p['almacen'])
                storePassword p['clave']
                keyAlias      p['alias']
                keyPassword   p['clave']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
            if (rootProject.file('firma.properties').exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
